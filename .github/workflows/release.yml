# Every push to main: lint, test, build Sauron.exe and publish it as a
# GitHub release. Installed copies poll the latest release and update
# themselves (see updater.py).
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Bump for notable changes; the patch number is the workflow run number.
  BASE_VERSION: "0.3"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Stamp version
        shell: pwsh
        run: |
          $v = "$env:BASE_VERSION.$env:GITHUB_RUN_NUMBER"
          @(
            "# Generated by the release workflow."
            "VERSION = `"$v`""
            "COMMIT = `"$env:GITHUB_SHA`""
          ) | Set-Content -Encoding utf8NoBOM version.py
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Version $v"

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean Sauron.spec

      - name: Check exe
        shell: pwsh
        run: |
          $exe = Get-Item dist/Sauron.exe
          if ($exe.Length -lt 50MB) { throw "Sauron.exe is suspiciously small: $($exe.Length) bytes" }
          Write-Host "Sauron.exe $([math]::Round($exe.Length / 1MB, 1)) MB"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $notes = if ($env:COMMIT_MESSAGE) { $env:COMMIT_MESSAGE } else { "Manual build of $env:GITHUB_SHA" }
          $notes | Set-Content -Encoding utf8NoBOM notes.md
          gh release create "v$env:VERSION" dist/Sauron.exe `
            --title "Sauron $env:VERSION" `
            --notes-file notes.md `
            --target $env:GITHUB_SHA `
            --latest
